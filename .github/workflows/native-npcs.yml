name: Build native NPCs JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-npcs-v0.3.1
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./gradlew test :fabric:build --no-daemon --console=plain
      - name: Prepare assets
        run: |
          set -euo pipefail
          mkdir release-assets
          cp fabric/build/libs/shirokai-trainers-0.3.1.jar release-assets/
          cp docs/npcs-cobblemon.md release-assets/NPCS-COBBLEMON.md
          cd release-assets
          sha256sum shirokai-trainers-0.3.1.jar > shirokai-trainers-0.3.1.jar.sha256
      - name: Upload JAR to Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shirokai-trainers-0.3.1
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
