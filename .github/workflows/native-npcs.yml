name: Build native NPCs prerelease

on:
  push:
    branches: [native-npcs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-npcs-v0.3.0
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/native-npcs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./gradlew test :fabric:build --no-daemon --console=plain
      - name: Prepare assets
        run: |
          set -euo pipefail
          mkdir release-assets
          cp fabric/build/libs/shirokai-trainers-0.3.0.jar release-assets/
          cp docs/npcs-cobblemon.md release-assets/NPCS-COBBLEMON.md
          cd release-assets
          sha256sum shirokai-trainers-0.3.0.jar > shirokai-trainers-0.3.0.jar.sha256
      - name: Publish prerelease after successful build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view v0.3.0 >/dev/null 2>&1; then
            gh release create v0.3.0 --target "$GITHUB_SHA" --title 'Shirokai Trainers 0.3.0 — NPCs nativos' --notes-file docs/release-v0.3.0.md --draft --prerelease
          fi
          gh release upload v0.3.0 release-assets/* --clobber
          gh release edit v0.3.0 --target "$GITHUB_SHA" --title 'Shirokai Trainers 0.3.0 — NPCs nativos' --notes-file docs/release-v0.3.0.md --draft=false --prerelease
