name: Build and publish release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-v0.2.2
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-v0.2.2]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./gradlew test :fabric:build --no-daemon --console=plain
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir release-assets
          cp fabric/build/libs/shirokai-trainers-0.2.2.jar release-assets/
          cp docs/guia-testes.md release-assets/GUIA-TESTES-v0.2.2.md
          cp docs/comandos-e-permissoes.md release-assets/COMANDOS-E-PERMISSOES-v0.2.2.md
          cd release-assets
          sha256sum shirokai-trainers-0.2.2.jar > shirokai-trainers-0.2.2.jar.sha256
      - name: Upload assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view v0.2.2 >/dev/null 2>&1; then
            gh release create v0.2.2 --target "$GITHUB_SHA" --title 'Shirokai Trainers 0.2.2 — batalhas acionadas por comando' --notes-file docs/release-v0.2.2.md --draft --prerelease
          fi
          gh release upload v0.2.2 release-assets/* --clobber
          gh release edit v0.2.2 --target "$GITHUB_SHA" --title 'Shirokai Trainers 0.2.2 — batalhas acionadas por comando' --notes-file docs/release-v0.2.2.md --draft=false --prerelease
